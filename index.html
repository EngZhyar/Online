<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Stats · Daily/Weekly</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1><i class="fas fa-hard-hat"></i>ئاماری کرێکارانی قەیوان</h1>

    <div class="form-grid">
        <div class="field">
            <label>ئامار</label>
            <select id="statType">
                <option value="daily" selected>رۆژانە</option>
                <option value="weekly">هەفتانە</option>
            </select>
        </div>

        <div class="field" id="dailyDateField">
            <label>بەروار</label>
            <input type="date" id="dailyDate">
        </div>
        <div class="field hidden" id="weeklyDateField">
            <label>دەستپێك و کۆتایی بەروار</label>
            <div class="date-range">
                <input type="date" id="weekStart">
                <span>—</span>
                <input type="date" id="weekEnd">
            </div>
        </div>

        <div class="field">
            <label>ناوی کرێکار</label>
            <select id="workerName">
                <option value="">— ناوی کرێکار هەڵبژێرە —</option>
            </select>
        </div>

        <div class="field">
            <label>وردەکاری ئیشەکە</label>
            <textarea id="workDesc" placeholder="Describe the work..."></textarea>
            <div class="helper-text" id="workHint"></div>
        </div>

        <div class="field">
            <label>ناوی ئەندازیار</label>
            <select id="engineerName">
                <option value="">— ناوی ئەندازیار هەڵبژێرە —</option>
            </select>
        </div>

        <div class="field">
            <label>(IQD) پارە</label>
            <input type="number" id="moneyInput" min="0" step="0.01" placeholder="0">
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus-circle"></i> ناوی کرێکار زیادبکە</button>
        <button class="btn btn-success" id="okBtn"><i class="fas fa-check-circle"></i> بینینی ئامار</button>
    </div>

    <div class="result-section" id="resultSection">
        <div class="result-header">
            <h2><i class="fas fa-table"></i> ئەنجام</h2>
        </div>

        <div class="summary-line" id="summaryLine">
            <span><i class="fas fa-calendar-alt"></i> <span id="summaryDateLabel">—</span></span>
            <span><i class="fas fa-coins"></i> کۆی گشتی پارە: <span id="summaryTotalMoney" class="money-highlight">0.00</span></span>
            <button class="download-btn" id="downloadPdfBtn" style="margin-left: auto;"><i class="fas fa-file-pdf"></i>PDFداونڵۆدکردنی ئامار بە</button>
        </div>

        <div class="table-wrapper">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>ناوی کرێکار</th>
                        <th>وردەکاری ئیشەکە</th>
                        <th>ناوی ئەندازیار</th>
                        <th>پارە</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="names.js"></script>
<script src="script.js"></script>
</body>
</html>
